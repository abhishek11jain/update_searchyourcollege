        <meta charset="utf-8">

    <body>

        <!-- Whatsapp Chat Start -->
            <div id='whatsapp-chat' class='hide'>

                        <p class="mb-0"><span>Welcome To Searchyourcollege</span></p>
                    </div>
                    <div class="close-btn p-2">
                        <a class='close-chat' href='javascript:void'><i class="fa fa-times fs-6 text-black" aria-hidden="true"></i></a>
                    </div>
                </div>
            </div>

        <!-- Whatsapp Chat End -->

        <!-- Whatsapp Code -->
        <script>
            $(document).on("click", ".close-chat", function() {
                $("#whatsapp-chat")

            }),
            $(document).on("click", ".chat-btn", function() {
                $("#whatsapp-chat")
                .addClass("show")
                .removeClass("hide");
            });
